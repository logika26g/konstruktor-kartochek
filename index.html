<div class="app-header">
  <h1>📚 Конструктор карточек</h1>
  <button class="btn btn-toggle" id="btnToggleLeft" onclick="togglePanel('left')">📋 Карточки</button>
  <button class="btn btn-toggle" id="btnToggleRight" onclick="togglePanel('right')">⚙️ Общие</button>
  <button class="btn btn-undo" onclick="undoAction()">↩️ Отменить</button>
  <button class="btn btn-preview" onclick="openPreview()">👁 Просмотр</button>
  <button class="btn btn-pdf" onclick="printPDF()">🖨 PDF</button>
</div>

<div class="workspace" id="mainWorkspace">
  <div class="center-preview">
    <div class="preview-stage">
      <div class="preview-card" id="previewCard"></div>

    <div class="preview-info" id="previewInfo">Карточка 1 из 1</div>

    <button class="btn btn-autofit" onclick="autofitCurrent()">🔧 Подогнать под карточку</button>
  </div>
</div>

<div class="side-panel left" id="panelLeft">

  </div>
  <div class="side-body" id="cardsAccordion"></div>
  <div style="padding: 20px; border-top: 1px solid #e2e8f0; flex-shrink: 0; background: #f8fafc;">

    <button class="btn btn-danger" style="width:100%; justify-content:center; margin-top:10px; background:#ef4444; padding: 12px;" onclick="clearAllCards()">🗑 Удалить всё</button>
  </div>
</div>

<div class="side-panel right" id="panelRight">
  <div class="side-header" onclick="togglePanel('right')">
    <h2>⚙️ Общие настройки</h2>
    <span class="close-icon">×</span>
  </div>
  <div class="side-body" id="settingsGrid"></div>
</div>

<div class="modal-overlay" id="previewModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Предпросмотр PDF</h2>
      <button class="modal-close" onclick="closePreview()">×</button>
    </div>
    <div class="modal-body" id="previewBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" style="background:#64748b;" onclick="closePreview()">Закрыть</button>
      <button class="btn btn-pdf" onclick="closePreview(); printPDF();">🖨 Печать / Сохранить PDF</button>
    </div>
  </div>
</div>

<div id="printRoot"></div>
<div class="toast" id="toast"></div>

<footer class="main-footer">

  while (lo <= hi) { const mid = Math.floor((lo + hi) / 2); if (test(mid)) { best = mid; lo = mid + 1; } else { hi = mid - 1; } }
  el.style.fontSize = best + 'px';
  return best;
}

</script><script>
/* ============================================================
   ДЕЙСТВИЯ С КАРТОЧКАМИ
   ============================================================ */
function applyStyleToAll(sourceIndex) {
  if (!confirm('Применить ВЕСЬ стиль (фон, градиент, рамки, шрифты, цвета, отступы) ко ВСЕМ остальным карточкам?\n\nВНИМАНИЕ: Картинки и сами тексты подписей останутся своими!')) return;
  
  saveUndoState();
  const source = state.cards[sourceIndex];
  
  const excludeKeys = [
    'image', 'text', 'caption', 'listName', 'textColor', 'imgQuality', 'manualLineBreaks'
  ];
  
  state.cards.forEach((card, i) => {
    if (i === sourceIndex) return;
    for (let key in source) {
      if (!excludeKeys.includes(key)) {
        card[key] = JSON.parse(JSON.stringify(source[key]));
      }
    }
  });

  renderCardsAccordion();
  renderSettings();
  renderPreview(true);
  showToast('✨ Стиль применён! Картинки и подписи остались прежними.', 'success');
}

function updateCard(i, field, value) {
  if (!state.cards[i]) return;
  if (!updateCard._isSliding) saveUndoState();
  
  state.cards[i][field] = value;
  
  if (i === state.previewIndex) {
    renderPreview(true);
  }
  
  if (field === 'listName') {
    const headerInput = document.querySelector(`#cardsAccordion .acc-item[data-index="${i}"] .acc-header input`);
    if (headerInput) {
      headerInput.value = value || 'Без текста';
    }
  }
  
  // Если меняем стиль рамки, нужно перерисовать интерфейс, чтобы показать/скрыть ползунки
  if (field === 'frameStyle') {
    renderCardsAccordion();
  }
}

document.addEventListener('mousedown', (e) => { if (e.target.type === 'range') updateCard._isSliding = true; });
document.addEventListener('mouseup', () => updateCard._isSliding = false);
document.addEventListener('touchstart', (e) => { if (e.target.type === 'range') updateCard._isSliding = true; }, {passive: true});
document.addEventListener('touchend', () => updateCard._isSliding = false);

function switchTab(btn, tabId) {
  const tabs = btn.parentElement.querySelectorAll('.tab-btn');
  tabs.forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const contents = btn.closest('.acc-content').querySelectorAll('.tab-content');
  contents.forEach(c => c.classList.remove('active'));
  const targetContent = document.getElementById(tabId);
  if (targetContent) targetContent.classList.add('active');
  state.openTab = tabId.startsWith('style-') ? 'style' : 'content';
}

function addCard() {
  saveUndoState();
  state.cards.push(newCard());
  state.previewIndex = state.cards.length - 1;
  state.openCardIndex = state.cards.length - 1;
  renderCardsAccordion(); renderPreview();
  setTimeout(() => {
    const items = document.querySelectorAll('#cardsAccordion .acc-item');
    if (items.length) items[items.length - 1].scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

function copyCard(i) {
  if (!state.cards[i]) return;
  saveUndoState();
  const original = state.cards[i];
  const copy = JSON.parse(JSON.stringify(original));
  copy.listName = (copy.listName || copy.text || 'Без текста') + ' (копия)';
  state.cards.splice(i + 1, 0, copy);
  state.previewIndex = i + 1;
  renderCardsAccordion(); renderPreview();
  showToast('📄 Карточка скопирована', 'success');
}

function previewCard(i) {
  state.previewIndex = i;
  renderPreview(true);
}

function deleteCard(i) {
  if (!confirm('Удалить карточку ' + (i + 1) + '?')) return;
  saveUndoState();
  state.cards.splice(i, 1);
  if (state.previewIndex >= state.cards.length) state.previewIndex = Math.max(0, state.cards.length - 1);
  state.openCardIndex = -1;
  renderCardsAccordion(); renderPreview();
}

function clearAllCards() {
  if (!confirm('Удалить ВСЕ карточки?')) return;
  saveUndoState();
  state.cards = []; state.previewIndex = 0; state.openCardIndex = -1;
  renderCardsAccordion(); renderPreview();
}

/* ============================================================
   ЗАГРУЗКА КАРТИНОК И СВОИХ ШРИФТОВ
   ============================================================ */
function applyUrl(i, inputEl) {
  const url = inputEl.value.trim();
  if (!url) return;
  saveUndoState();
  showToast('⏳ Загружаем картинку...', 'success');
  const attempts = [
    { name: 'Напрямую', url: url },
    { name: 'Прокси 1', url: 'https://images.weserv.nl/?url=' + encodeURIComponent(url) },
    { name: 'Прокси 2', url: 'https://wsrv.nl/?url=' + encodeURIComponent(url) }
  ];
  let attemptIndex = 0;
  function tryNext() {
    if (attemptIndex >= attempts.length) {
      showToast('❌ Не удалось загрузить. Скачайте файл и добавьте через «📁 Файл»', 'error');
      return;
    }
    const attempt = attempts[attemptIndex];
    const img = new Image();
    const timeout = setTimeout(() => { img.onload = null; img.onerror = null; attemptIndex++; tryNext(); }, 3000);
    img.onload = () => {
      clearTimeout(timeout);
      state.cards[i].image = attempt.url;
      inputEl.value = '';
      renderCardsAccordion(); renderPreview(true);
      showToast('✅ Картинка добавлена (' + attempt.name + ')', 'success');
    };
    img.onerror = () => { clearTimeout(timeout); attemptIndex++; tryNext(); };
    img.src = attempt.url;
  }
  tryNext();
}

function clearImage(i) {
  saveUndoState();
  state.cards[i].image = '';
  renderCardsAccordion(); renderPreview();
}

function uploadImage(i, event) {
  const file = event.target.files[0]; if (!file) return;
  saveUndoState();
  showToast('⏳ Обработка...');
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX = state.cards[i].imgQuality || 800;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } } else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      state.cards[i].image = c.toDataURL('image/jpeg', 0.85);
      renderCardsAccordion(); renderPreview(true);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file); event.target.value = '';
}

function uploadCustomFrame(i, event) {
  const file = event.target.files[0]; if (!file) return;
  saveUndoState();
  const reader = new FileReader();
  reader.onload = (e) => {
    state.cards[i].customFrame = e.target.result;
    renderCardsAccordion(); renderPreview(true);
  };
  reader.readAsDataURL(file); event.target.value = '';
}

function uploadCustomFont(i, event) {
  const file = event.target.files[0]; if (!file) return;
  saveUndoState();
  showToast('⏳ Загрузка и сжатие шрифта...');
  const reader = new FileReader();
  reader.onload = (e) => {
    const fontName = file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9а-яА-Я_\-]/g, "_");
    const fontData = e.target.result;
    if (window.woff2) {
      try {
        window.woff2.compress(fontData).then(compressed => {
          const base64 = 'data:font/woff2;base64,' + btoa(String.fromCharCode.apply(null, compressed));
          saveCustomFont(i, fontName, base64);
        }).catch(() => { saveCustomFont(i, fontName, fontData); });
      } catch (err) { saveCustomFont(i, fontName, fontData); }
    } else {
      saveCustomFont(i, fontName, fontData);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function saveCustomFont(i, fontName, fontData) {
  const style = document.createElement('style');
  style.textContent = "@font-face { font-family: '" + fontName + "'; src: url(" + fontData + "); font-weight: 400 900; }";
  document.head.appendChild(style);
  customFonts[fontName] = fontData;
  state.cards[i].fontFamily = fontName;
  renderCardsAccordion(); renderPreview(true);
  showToast('✅ Шрифт "' + fontName + '" загружен и сжат!', 'success');
}

/* ============================================================
   ЖИВОЕ ПРЕВЬЮ
   ============================================================ */
function getGridInfo() { return GRID_OPTIONS.find(g => g.id === state.grid) || GRID_OPTIONS[2]; }
function getPageDimensions() {
  const size = PAGE_SIZES[state.pageFormat] || PAGE_SIZES.A4;
  return state.orientation === 'landscape' ? { w: size.h, h: size.w } : { w: size.w, h: size.h };
}

let hoverState = { font: null, frame: null, weight: null };
function hoverFontPreview(fontName) { hoverState.font = fontName; renderPreview(true); }
function hoverWeightPreview(weight) { hoverState.weight = weight; renderPreview(true); }
function hoverFramePreview(frameId) { hoverState.frame = frameId; renderPreview(true); }
function resetHoverPreview() { hoverState.font = null; hoverState.frame = null; hoverState.weight = null; renderPreview(true); }

function renderPreview(silent = false) {
  const wrap = document.getElementById('previewCard');
  const info = document.getElementById('previewInfo');
  const warn = document.getElementById('previewWarn');
  
  const wasReady = wrap.classList.contains('ready');
  wrap.classList.remove('warn-state');
  warn.textContent = '';
  
  if (state.orientation === 'landscape') {
    wrap.classList.add('landscape');
  } else {
    wrap.classList.remove('landscape');
  }
  
  const card = state.cards[state.previewIndex];
  if (!card) {
    wrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;">Нет карточки</div>';
    info.textContent = 'Карточек нет'; 
    wrap.classList.add('ready');
    return;
  }

  info.textContent = 'Карточка ' + (state.previewIndex + 1) + ' из ' + state.cards.length;
  
  const fontName = hoverState.font || card.fontFamily || 'Segoe UI';
  ensureFontLoaded(fontName);

  wrap.innerHTML = '';
  
  let baseWidth = 380;
  let baseHeight = 506;
  if (state.orientation === 'landscape') {
    baseWidth = 506;
    baseHeight = 380;
  }
  
  const br = (card.borderRadius !== undefined ? card.borderRadius : 3) * (baseWidth/60);
  wrap.style.borderRadius = br + 'px';
  
  const scale = baseWidth / 340;
  const inner = buildCardContent(card, scale, hoverState.font, hoverState.frame, hoverState.weight);
  inner.style.margin = 'auto';
  wrap.appendChild(inner);

  if (wasReady || silent) {
    wrap.classList.add('ready');
  }

  const finalFont = hoverState.font || card.fontFamily || 'Segoe UI';
  document.fonts.load('900 16px "' + finalFont + '"').then(() => {
    setTimeout(() => {
      wrap.classList.add('ready');
      
      const texts = inner.querySelectorAll('.ci-top-panel, .ci-bottom-panel, .ci-overlay-text');
      let overflow = false;
      texts.forEach(el => {
        if (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1) {
          overflow = true;
          el.style.outline = '2px dashed #ef4444';
          el.style.outlineOffset = '-2px';
        }
      });
      if (overflow) {
        if (card.manualLineBreaks) {
          warn.textContent = '⚠️ Текст не влезает — проверьте переносы и размер шрифта';
        } else {
          warn.textContent = '⚠️ Текст не влезает — уменьшите размер или отступы';
        }
        wrap.classList.add('warn-state');
      }
    }, 30);
  }).catch(() => {
    wrap.classList.add('ready');
  });
}

function autofitCurrent() {
  const card = state.cards[state.previewIndex];
  if (!card) return;
  if (card.manualLineBreaks) {
    showToast('⚠️ При ручном переносе автоподгонка отключена', 'error');
    return;
  }
  saveUndoState();
  const mainText = document.querySelector('#previewCard .ci-bottom-panel, #previewCard .ci-top-panel, #previewCard .ci-overlay-text');
  if (mainText && mainText.textContent.trim() !== '') {
    const maxW = mainText.clientWidth;
    const maxH = mainText.clientHeight;
    const fittedPx = fitTextToBox(mainText, maxW, maxH, 8, 150);
    const baseWidth = state.orientation === 'landscape' ? 506 : 380;
    card.baseFontSize = Math.round(fittedPx / (baseWidth / 340));
  }
  renderCardsAccordion(); renderPreview(true);
  showToast('🔧 Размер подогнан под карточку', 'success');
}

/* ============================================================
   ПРАВАЯ ПАНЕЛЬ: ОБЩИЕ НАСТРОЙКИ
   ============================================================ */
function renderSettings() {
  const box = document.getElementById('settingsGrid');
  const gridOptions = GRID_OPTIONS.map(g => '<option value="' + g.id + '"' + (state.grid === g.id ? ' selected' : '') + '>' + g.label + '</option>').join('');
  const pageBgSwatches = PAGE_BG_PRESETS.map(c => '<div class="swatch' + (state.pageBg.toLowerCase() === c.toLowerCase() ? ' active' : '') + '" style="background:' + c + ';" onclick="setSetting(\'pageBg\', \'' + c + '\')"></div>').join('');
  
  box.innerHTML =
    '<div class="setting-group sg-sheet"><h3>📄 Лист</h3>' +
      '<div class="setting-row"><label>Формат</label><select onchange="setSetting(\'pageFormat\', this.value)"><option value="A4"' + (state.pageFormat === 'A4' ? ' selected' : '') + '>A4</option><option value="A5"' + (state.pageFormat === 'A5' ? ' selected' : '') + '>A5</option></select></div>' +
      '<div class="setting-row"><label>Ориент.</label><select onchange="setSetting(\'orientation\', this.value)"><option value="portrait"' + (state.orientation === 'portrait' ? ' selected' : '') + '>Портрет</option><option value="landscape"' + (state.orientation === 'landscape' ? ' selected' : '') + '>Альбом</option></select></div>' +
      '<div class="setting-row"><label>Сетка</label><select onchange="setSetting(\'grid\', this.value)">' + gridOptions + '</select></div>' +
      '<div class="setting-row"><label>Поля мм</label><input type="number" min="0" max="30" value="' + state.marginMm + '" onchange="setSetting(\'marginMm\', +this.value)"></div>' +
      '<div class="setting-row"><label>Отступы</label><input type="number" min="0" max="20" value="' + state.gapMm + '" onchange="setSetting(\'gapMm\', +this.value)"></div>' +
    '</div>' +
    '<div class="setting-group sg-bg"><h3>🎨 Фон листа</h3>' +
      '<div class="setting-row"><label>Цвет листа</label><input type="color" value="' + state.pageBg + '" onchange="setSetting(\'pageBg\', this.value)"></div><div class="swatches">' + pageBgSwatches + '</div>' +
      '<p style="font-size:11px; color:#64748b; margin-top:10px; line-height:1.4;">Все настройки карточек находятся внутри каждой карточки в левой панели.</p>' +
    '</div>';
}

function setSetting(key, value) {
  saveUndoState();
  state[key] = value;
  if (key === 'pageBg') document.body.style.background = value;
  if (key === 'orientation') {
    renderPreview(false);
  } else {
    renderPreview(true);
  }
  renderSettings();
}
</script><script>
/* ============================================================
   ПРЕДПРОСМОТР PDF И ПЕЧАТЬ
   ============================================================ */
function openPreview() {
  const body = document.getElementById('previewBody');
  body.innerHTML = '';
  if (state.cards.length === 0) {
    body.innerHTML = '<div style="text-align:center;padding:60px;color:#475569;">Нет карточек</div>';
    document.getElementById('previewModal').classList.add('active'); return;
  }
  const page = getPageDimensions();
  const grid = getGridInfo();
  const cellsPerPage = grid.cols * grid.rows;
  const totalPages = Math.ceil(state.cards.length / cellsPerPage);
  const PREVIEW_WIDTH_PX = 720;
  const scale = PREVIEW_WIDTH_PX / page.w;
  const marginPx = state.marginMm * scale;
  const gapPx = state.gapMm * scale;

  for (let p = 0; p < totalPages; p++) {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page-preview';
    pageDiv.style.width = '100%'; pageDiv.style.maxWidth = '780px';
    const pageHeightPx = page.h * scale;
    pageDiv.style.minHeight = pageHeightPx + 'px';
    pageDiv.style.background = state.pageBg;
    pageDiv.style.padding = marginPx + 'px';
    
    const label = document.createElement('div'); label.className = 'page-label';
    label.textContent = 'Страница ' + (p + 1) + ' из ' + totalPages;
    pageDiv.appendChild(label);
    
    const gridDiv = document.createElement('div'); gridDiv.className = 'page-grid';
    gridDiv.style.gridTemplateColumns = 'repeat(' + grid.cols + ', 1fr)';
    gridDiv.style.gridTemplateRows = 'repeat(' + grid.rows + ', 1fr)';
    gridDiv.style.gap = gapPx + 'px';
    gridDiv.style.placeContent = 'stretch';
    
    const availableWidth = PREVIEW_WIDTH_PX - (marginPx * 2) - (gapPx * (grid.cols - 1));
    const availableHeight = pageHeightPx - (marginPx * 2) - (gapPx * (grid.rows - 1)) - 40;
    
    let cellW = availableWidth / grid.cols;
    let cellH = availableHeight / grid.rows;
    
    const ratio = (state.orientation === 'landscape') ? 4 / 3 : 3 / 4;
    
    if (state.grid === '1x1') {
      cellW = availableWidth;
      cellH = availableHeight;
    } else {
      if (cellW / cellH > ratio) {
        cellW = cellH * ratio;
      } else {
        cellH = cellW / ratio;
      }
    }
    
    for (let c = 0; c < cellsPerPage; c++) {
      const cardIndex = p * cellsPerPage + c;
      const cell = document.createElement('div'); cell.className = 'page-card-wrap';
      cell.style.width = '100%';
      cell.style.height = '100%';
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      
      if (cardIndex < state.cards.length) {
        const card = state.cards[cardIndex];
        const br = (card.borderRadius !== undefined ? card.borderRadius : 3) * scale;
        
        const cardWrapper = document.createElement('div');
        cardWrapper.style.width = cellW + 'px';
        cardWrapper.style.height = cellH + 'px';
        cardWrapper.style.borderRadius = br + 'px';
        cardWrapper.style.overflow = 'hidden';
        cardWrapper.style.flexShrink = '0';
        
        const fontScale = cellW / 340;
        const innerCard = buildCardContent(card, fontScale);
        innerCard.classList.add('ready');
        cardWrapper.appendChild(innerCard);
        cell.appendChild(cardWrapper);
      }
      gridDiv.appendChild(cell);
    }
    pageDiv.appendChild(gridDiv);
    
    const fDiv = document.createElement('div'); fDiv.className = 'page-footer';
    fDiv.innerHTML = 'Свинина Галина Сергеевна | <a href="https://vk.ru/logika24" target="_blank">vk.ru/logika24</a><div class="copyright">Авторские права защищены. Копирование и распространение строго запрещается.</div>';
    pageDiv.appendChild(fDiv);
    body.appendChild(pageDiv);
  }
  document.getElementById('previewModal').classList.add('active');
}

function printPDF() {
  if (state.cards.length === 0) { showToast('❌ Нет карточек', 'error'); return; }
  const printRoot = document.getElementById('printRoot'); printRoot.innerHTML = '';
  const page = getPageDimensions(); 
  const grid = getGridInfo();
  const cellsPerPage = grid.cols * grid.rows; 
  const totalPages = Math.ceil(state.cards.length / cellsPerPage);

  const pageCSS = state.orientation === 'landscape' 
    ? '@page { size: ' + state.pageFormat + ' landscape; margin: 0; }' 
    : '@page { size: ' + state.pageFormat + ' portrait; margin: 0; }';
  let pageStyle = document.getElementById('printPageStyle');
  if (!pageStyle) { pageStyle = document.createElement('style'); pageStyle.id = 'printPageStyle'; document.head.appendChild(pageStyle); }
  pageStyle.textContent = pageCSS;

  for (let p = 0; p < totalPages; p++) {
    const pageDiv = document.createElement('div'); pageDiv.className = 'print-page';
    pageDiv.style.width = page.w + 'mm';
    pageDiv.style.height = page.h + 'mm';
    pageDiv.style.padding = state.marginMm + 'mm';
    pageDiv.style.background = state.pageBg;
    pageDiv.style.boxSizing = 'border-box';
    pageDiv.style.display = 'flex';
    pageDiv.style.flexDirection = 'column';

    const gridDiv = document.createElement('div'); gridDiv.className = 'print-grid';
    gridDiv.style.display = 'grid';
    gridDiv.style.gridTemplateColumns = 'repeat(' + grid.cols + ', 1fr)';
    gridDiv.style.gridTemplateRows = 'repeat(' + grid.rows + ', 1fr)';
    gridDiv.style.gap = state.gapMm + 'mm';
    gridDiv.style.flex = '1';
    gridDiv.style.minHeight = '0';
    gridDiv.style.placeContent = 'stretch';

    for (let c = 0; c < cellsPerPage; c++) {
      const cardIndex = p * cellsPerPage + c;
      
      const cellWrapper = document.createElement('div');
      cellWrapper.style.display = 'flex';
      cellWrapper.style.alignItems = 'center';
      cellWrapper.style.justifyContent = 'center';
      cellWrapper.style.overflow = 'hidden';
      cellWrapper.style.width = '100%';
      cellWrapper.style.height = '100%';

      if (cardIndex < state.cards.length) {
        const card = state.cards[cardIndex];
        
        const cardEl = document.createElement('div');
        cardEl.className = 'print-card-wrap';
        
        const cellW = (page.w - state.marginMm * 2 - state.gapMm * (grid.cols - 1)) / grid.cols;
        const cellH = (page.h - state.marginMm * 2 - 15 - state.gapMm * (grid.rows - 1)) / grid.rows;
        
        let finalW = cellW;
        let finalH = cellH;
        const ratio = (state.orientation === 'landscape') ? 4 / 3 : 3 / 4;
        
        if (finalW / finalH > ratio) {
          finalW = finalH * ratio;
        } else {
          finalH = finalW / ratio;
        }

        cardEl.style.width = finalW + 'mm';
        cardEl.style.height = finalH + 'mm';
        cardEl.style.flexShrink = '0';
        cardEl.style.position = 'relative';
        cardEl.style.overflow = 'hidden';
        
        const br = (card.borderRadius !== undefined ? card.borderRadius : 3);
        cardEl.style.borderRadius = br + 'mm';

        const fontScale = (finalW * MM_TO_PX) / 340;

        const innerCard = buildCardContent(card, fontScale);
        innerCard.classList.add('ready');
        innerCard.style.width = '100%';
        innerCard.style.height = '100%';
        innerCard.style.borderRadius = 'inherit';
        
        cardEl.appendChild(innerCard);
        cellWrapper.appendChild(cardEl);
      }
      gridDiv.appendChild(cellWrapper);
    }
    pageDiv.appendChild(gridDiv);
    
    // Убрано имя автора, оставлен только копирайт
    const fDiv = document.createElement('div'); fDiv.className = 'print-footer';
    fDiv.innerHTML = '<div class="copyright">Авторские права защищены.</div>';
    pageDiv.appendChild(fDiv);
    printRoot.appendChild(pageDiv);
  }

  requestAnimationFrame(() => {
    setTimeout(() => { window.print(); }, 300);
  });
}

function closePreview() { 
  document.getElementById('previewModal').classList.remove('active'); 
}

/* ============================================================
   ПЕРЕИМЕНОВАНИЕ И DRAG & DROP
   ============================================================ */
function updateCardName(i, newName) {
  if (!state.cards[i]) return;
  saveUndoState();
  state.cards[i].listName = newName;
  
  const cardInput = document.querySelector(`input[data-name-input="${i}"]`);
  if (cardInput) cardInput.value = newName;

  if (state.previewIndex === i) renderPreview(true);
}

document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('cardsAccordion');
  
  container.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      const item = e.target.closest('.acc-item');
      if (item) item.setAttribute('draggable', 'false');
    }
  });

  container.addEventListener('mouseup', (e) => {
    const items = container.querySelectorAll('.acc-item');
    items.forEach(item => item.setAttribute('draggable', 'true'));
  });

  container.addEventListener('dragstart', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      e.preventDefault();
      return;
    }
    
    const item = e.target.closest('.acc-item');
    if (!item) return;
    e.dataTransfer.setData('text/plain', item.dataset.index);
    item.style.opacity = '0.5';
    item.style.border = '2px dashed #7c3aed';
  });

  container.addEventListener('dragend', (e) => {
    const item = e.target.closest('.acc-item');
    if (!item) return;
    item.style.opacity = '1';
    item.style.border = '1px solid #e2e8f0';
  });

  container.addEventListener('dragover', (e) => {
    e.preventDefault();
    const draggingItem = container.querySelector('.acc-item[style*="opacity: 0.5"]');
    if (!draggingItem) return;
    
    const siblings = [...container.querySelectorAll('.acc-item:not([style*="opacity: 0.5"])')];
    let nextSibling = siblings.find(sibling => {
      return e.clientY <= sibling.getBoundingClientRect().top + sibling.offsetHeight / 2;
    });
    
    if (nextSibling) {
      container.insertBefore(draggingItem, nextSibling);
    } else {
      container.appendChild(draggingItem);
    }
  });

  container.addEventListener('drop', (e) => {
    e.preventDefault();
    saveUndoState();
    
    const items = [...container.querySelectorAll('.acc-item')];
    const newCards = items.map(item => state.cards[item.dataset.index]);
    
    state.cards = newCards;
    state.previewIndex = 0;
    
    renderCardsAccordion();
    renderPreview(true);
    showToast('🔄 Порядок карточек изменен', 'success');
  });
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  state.cards = [
    Object.assign(newCard()),
    Object.assign(newCard()),
    Object.assign(newCard()),
    Object.assign(newCard())
  ];
  state.previewIndex = 0;
  state.openTab = 'content';
  
  renderCardsAccordion();
  renderSettings();
  
  const previewCard = document.getElementById('previewCard');
  previewCard.classList.remove('ready');
  
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      setTimeout(() => {
        renderPreview(true);
      }, 50);
    });
  } else {
    renderPreview(true);
  }
  
  document.getElementById('previewModal').addEventListener('click', (e) => { 
    if (e.target === e.currentTarget) closePreview(); 
  });
  
  document.addEventListener('keydown', (e) => { 
    if (e.key === 'Escape') closePreview(); 
  });
});
